    literal_gloss: Indra (the name; no secure derivation)
    philosophical_gloss: 'Indra is the foremost Vedic god, but the Chāndogya casts him in an
      unfamiliar role: the student who is not satisfied. Sent by the gods to learn the self
      from Prajāpati, he receives the answer that the self is the reflection in water — and,
      unlike Virocana, sees on the way home that it cannot be right. He returns three further
      times, and only in the fourth teaching (ChU 8.12) is he told of the bodiless self that
      pleasure and pain do not touch.'
