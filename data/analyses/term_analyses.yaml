    philosophical_gloss: 'Āśrama is built on √śram, ''to exert oneself'', and names a place
      or condition of disciplined effort — first a hermitage, later each of the four stages
      of life (student, householder, forest-dweller, renouncer). The fully articulated four-stage
      scheme, however, belongs to the Dharmasūtra literature rather than to the principal Upaniṣads.
      In the corpus consulted here the word occurs essentially once, and negatively: ŚvU 6.21
      says the teaching was given to those ''beyond the āśramas''.'
