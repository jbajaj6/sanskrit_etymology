      The compound analysis is standard: viveka (discrimination) + khyāti
      (vision/perception) in a genitive tatpuruṣa. Some translators render
      viveka-khyāti as a single concept ("discriminative discernment") rather
      than parsing the compound, which is reasonable for a non-technical
      audience but obscures the two-part structure. The root of viveka is
      sometimes given as √vic (Monier-Williams) and sometimes as √vij;
      √vic ("to sift, separate") is the standard attribution.
