    literal_gloss: the one who shines forth
    philosophical_gloss: Virocana is the demons' representative in the Chāndogya's teaching
      narrative, and his function is to be the counter-example. Given the same provisional answer
      as Indra — that the self is the reflection seen in water — he accepts it, departs satisfied,
      and teaches the demons that the body is the self, to be adorned and served. Indra alone
      notices the answer's inadequacy and returns.
    doctrinal_significance: 'The pairing is deliberate: the same words produce understanding
      in one hearer and error in another. The Upaniṣads use it to argue that teaching cannot
      be evaluated apart from the hearer''s readiness to be dissatisfied.'
    ambiguity_notes: Virocana's error is described as the doctrine that the body is the self
      — a position the text attributes to the asuras. Whether this is a genuine philosophical
      school being criticised or a narrative device is not settled.
