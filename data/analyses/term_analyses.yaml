      a unified process. The Vibhūti Pāda (YS chapter 3) is essentially a
      catalogue of what happens when saṃyama is directed at various objects:
      applied to the three transformations (pariṇāma), it yields knowledge
      of past and future; applied to the distinction between word, meaning,
      and concept, it yields understanding of all beings' speech; and so on.
