        devanagari: "स्व"
        meaning: "own, one's own (pronomial adjective)"
        dhatu_number: null
      - root: "rūpa"
        devanagari: "रूप"
        meaning: "form, appearance, nature (from √rūp, 'to form, figure')"
        dhatu_number: null
